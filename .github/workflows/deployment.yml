name: Deploy Project
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      FileName: ${{ steps.publish.outputs.FileName }}
    steps:
      - name: Publish Job Outpurt
        id: publish
        run: |
          echo "FileName=abcd" >> $GITHUB_OUTPUT ';'
          echo "Username1 ${{ vars.USERNAME1 }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Read Output from Build Job
        run: |
          echo "File Name  ${{ needs.build.outputs.FileName}}"
          echo "Username1 ${{ vars.USERNAME1 }}"