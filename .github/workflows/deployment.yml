name: Deploy Project
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Download Code
              uses: actions/checkout@v3
            
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '18'
            
            - name: Install Dependencies
              run: npm ci
              
            - name: Run Test
              run: npm test

            - name: Build project
              run: npm run build

            - name: Upload Artifacts
              uses: actions/upload-artifact@v3
              with:
                name: artifacts
                path: |
                  out
  
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy
              run: echo "Deploying ..."
    